<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff5a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Подход">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Подход — тренировки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE: спокойный тренер в кармане — коротко, по делу, без давления
   IDEA: мобильное приложение-карточка тренировок: опрос, план, подходы × повторы
   PICTURE: анимированный силуэт, который выполняет упражнение
   COLOUR and TYPE: белый мел + графит, один оранжевый акцент; Unbounded + Onest
   LAYOUT: экран телефона, верхняя шапка, нижнее меню, листы снизу */
:root{color-scheme:light dark;--bg:light-dark(#fafaf8,#121315);--out:light-dark(#e9e9e4,#08090a);--card:light-dark(#fff,#1c1d20);--soft:light-dark(#efefeb,#26272b);--line:light-dark(#e2e2dc,#33343a);--ink:light-dark(#16171b,#f0f0ec);--mute:light-dark(#62646b,#a3a5ab);--acc:#ff5a1f;--accs:light-dark(#ffe9df,#3a2219);--ok:light-dark(#1d7a46,#5fd193);--okbg:light-dark(#dff3e7,#1b3226);--bad:light-dark(#b4231a,#ff8a80);--badbg:light-dark(#fbe3e1,#3b1f1d);--body:light-dark(#5d636e,#a3a8b2);--bodyL:light-dark(#9097a3,#d4d7dd);--bodyD:light-dark(#363a42,#767b85);--eqc:light-dark(#1d1f24,#ecece6);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
svg,img{-webkit-user-drag:none}
body{margin:0;background:var(--out);color:var(--ink);font:16px/1.5 Onest,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:Unbounded,Onest,sans-serif;font-weight:600;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,7vw,30px)}h2{font-size:19px}h3{font-size:17px;margin:0}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:440px;height:100%;height:100dvh;margin:auto;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:520px){.app{height:calc(100dvh - 40px);margin:20px auto;border-radius:32px;border:1px solid var(--line);overflow:hidden;box-shadow:0 20px 60px rgb(0 0 0/.12)}}
.bar{flex:none;position:relative;z-index:5;background:var(--bg);padding:calc(var(--st) + 6px) 18px 8px;display:flex;align-items:center;gap:10px;min-height:56px}
.bar .t{font:600 18px Unbounded,sans-serif;flex:1}
.logo{width:12px;height:12px;border-radius:50%;background:var(--acc)}
.iconb{width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:6px 18px 28px}
.scr.noTab{padding-bottom:calc(24px + var(--sb))}
.scr *{touch-action:pan-y}
.dsel,.dsel *{touch-action:pan-x}
.tabs{flex:none;position:relative;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb))}
.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:500;border-radius:12px}
.tabs a.on{color:var(--acc)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.stack{display:grid;gap:12px}
.lead{color:var(--mute);margin:8px 0 16px}
.note{font-size:14px;color:var(--mute)}
.btn{display:block;width:100%;min-height:54px;padding:14px 20px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-weight:700;font-size:17px;text-align:center;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.4}
/* опрос */
.scr.qm{display:flex;flex-direction:column}
.qbody.inR{animation:qinR .34s cubic-bezier(.2,.8,.2,1) both}.qbody.inL{animation:qinL .34s cubic-bezier(.2,.8,.2,1) both}
.qbody.outL,.qbody.outR{transition:opacity .16s ease-in,transform .16s ease-in;opacity:0}.qbody.outL{transform:translateX(-24px)}.qbody.outR{transform:translateX(24px)}
@keyframes qinR{from{opacity:0;transform:translateX(32px)}}@keyframes qinL{from{opacity:0;transform:translateX(-32px)}}
.scr.pgOutL,.scr.pgOutR{transition:opacity .15s ease-in,transform .15s ease-in;opacity:0}.scr.pgOutL{transform:translateX(-20px)}.scr.pgOutR{transform:translateX(20px)}
.scr.pgInR{animation:pgInR .38s cubic-bezier(.2,.8,.2,1) both}.scr.pgInL{animation:pgInL .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes pgInR{from{opacity:0;transform:translateX(30px)}}@keyframes pgInL{from{opacity:0;transform:translateX(-30px)}}
.bar.bIn>*{animation:bIn .3s ease-out both}@keyframes bIn{from{opacity:0;transform:translateY(-4px)}}
.tabs{position:relative}.tabs a{position:relative;z-index:1;transition:color .25s}
.tabind{position:absolute;z-index:0;top:6px;left:6px;width:calc((100% - 12px)/5);height:52px;border-radius:14px;background:var(--accs);transition:transform .42s cubic-bezier(.2,.9,.25,1.15)}
.tabs a.on svg{animation:tpop .4s cubic-bezier(.2,1.4,.4,1)}@keyframes tpop{40%{transform:scale(.82)}}
.prog i{transition:width .45s cubic-bezier(.2,.8,.2,1)}
.opt{transition:border-color .2s,background .2s,transform .12s}.opt:active{transform:scale(.98)}
@media(prefers-reduced-motion:reduce){.qbody.inR,.qbody.inL,.scr.pgInR,.scr.pgInL,.bar.bIn>*,.tabs a.on svg{animation:none}.tabind,.scr.pgOutL,.scr.pgOutR{transition:none}.qbody.outL,.qbody.outR{transition:none}}
.scr.qm>*{flex:1 0 auto}
.quiz{display:flex;flex-direction:column}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:4px 0 26px}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qn{font-size:14px;color:var(--mute);margin-bottom:6px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:12px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card)}
.opt b{display:block}.opt small{display:block;color:var(--mute);font-size:14px}
.opt.on{border-color:var(--acc);background:var(--accs)}
.opt .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font:600 16px Unbounded,sans-serif}
.opt.on .ic{background:var(--acc);color:#fff}
.num{display:flex;align-items:center;justify-content:center;gap:16px;margin:40px 0 18px}
.num button{width:56px;height:56px;border-radius:50%;border:0;background:var(--soft);font-size:26px}
.num input{width:150px;text-align:center;border:0;background:none;font:600 56px Unbounded,sans-serif;padding:0}
.unit{text-align:center;color:var(--mute);margin-top:-12px}
input[type=range]{width:100%;accent-color:var(--acc);height:44px}
input[type=time]{display:block;margin:34px auto 18px;font:600 48px Unbounded,sans-serif;border:0;background:var(--soft);border-radius:20px;padding:12px 20px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.qnav{margin-top:auto;padding-top:24px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.qnav .iconb{width:54px;height:54px}
.mascotLine{display:flex;gap:10px;align-items:center;margin-bottom:14px}.mascotLine svg{width:52px;height:52px;flex:none}
.bubble{background:var(--soft);border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:500;font-size:15px}
/* план */
.week{display:grid;gap:6px;margin:14px 0}
.day{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--soft);min-height:52px}
.day.tr{background:var(--ink);color:var(--bg)}
.day.today{box-shadow:inset 0 0 0 3px var(--acc)}
.day b{font:600 15px Unbounded,sans-serif;width:30px}.day span{flex:1;font-size:15px}
.day .tm{font-weight:700;color:var(--acc);white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:600 24px Unbounded,sans-serif;white-space:nowrap}
.stat.ps b{font-size:clamp(17px,5vw,21px)}.stat.ps b.gl{font-size:clamp(14px,4.2vw,17px);white-space:normal;overflow-wrap:anywhere;line-height:1.25;padding:3px 0}.stat span{color:var(--mute);font-size:13px}
/* программа */
.dsel{display:flex;gap:8px;overflow-x:auto;overscroll-behavior:none;margin:6px -18px 14px;padding:0 18px;scrollbar-width:none}
.dsel button{flex:none;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.dsel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exr{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:6px;border-top:1px solid var(--line)}
.exr:first-of-type{border-top:0}
.exb{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;border:0;background:none;text-align:left;padding:10px 0;min-height:64px}
.exb svg{width:64px;height:48px;border-radius:12px;background:var(--soft)}
.nm{font-weight:700;display:block;line-height:1.25}.sr{font-size:14px;color:var(--mute)}.sr b{color:var(--acc);font-weight:700}
.swap{width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.swap svg,.sbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cardio{border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--mute)}
/* упражнение */
.stage{position:relative;border-radius:24px;background:var(--soft);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:16px}
.mus{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.mu{padding:4px 10px;border-radius:999px;background:var(--soft);font-size:14px}.mu.p{background:#e8322b;color:#fff}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.big div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.big b{font:600 20px Unbounded,sans-serif;display:block;white-space:nowrap}.big span{font-size:13px;color:var(--mute)}
ol.steps{padding-left:22px;margin:8px 0 0}ol.steps li{margin:6px 0}
ul.bad{padding-left:20px;margin:8px 0 0}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px}
/* трекер */
.todayc{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wknav b{flex:1;text-align:center}
table.hb{border-collapse:separate;border-spacing:0 6px;width:100%}
.hb th{font-size:12px;font-weight:500;color:var(--mute);text-align:center;padding:0 2px}
.hb td{text-align:center;padding:0 2px}
.hb td:first-child{text-align:left;font-weight:700;white-space:nowrap;font-size:14px}
.hb tr.cur td:first-child{color:var(--acc)}
.cell{width:100%;max-width:52px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.cell.pl{border:2px dashed var(--acc)}
.cell.done{background:var(--okbg);color:var(--ok);border-color:transparent}
.cell.miss{background:var(--badbg);color:var(--bad);border-color:transparent}
/* лист снизу */
.shade{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:30;display:none}
.shade.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;z-index:31;width:min(440px,100%);max-height:86vh;overflow-y:auto;overscroll-behavior:none;touch-action:pan-y;transform:translate(-50%,105%);visibility:hidden;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + var(--sb));transition:transform .4s cubic-bezier(.2,1.25,.4,1),visibility 0s .4s}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s cubic-bezier(.2,1.25,.4,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media(prefers-reduced-motion:reduce){.sheet,.prog i{transition:none}}
.reasons{display:grid;gap:8px;margin-top:12px}
.reasons button{min-height:48px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.mlist{margin:10px 0;padding:0;list-style:none}
.mlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mlist b{white-space:nowrap}
.lin{display:block;width:100%;min-height:48px;margin-top:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px;font-size:17px;color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:20px 0 8px}
.dpk{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font:600 14px Unbounded,sans-serif;padding:0}
.dpk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pgpick,.prg{display:grid;gap:2px;width:100%;text-align:left;margin-bottom:12px;font:inherit;color:inherit}.pgpick b,.prg b{font-size:17px}
.prg{margin:0;cursor:pointer}.prg.on{border-color:var(--acc);background:var(--accs)}
.chat{display:grid;gap:10px;padding-bottom:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}.msg svg{width:34px;height:34px;flex:none}
.msg .bub{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.msg.g .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.u{margin-left:auto}.msg.u .bub{background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chips2 .chip{min-height:38px;padding:6px 12px;font-size:14px}
.cin{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 50px;gap:8px;padding:8px 0 2px;background:var(--bg)}
.cin input{min-height:50px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:10px 14px;font-size:16px;color:var(--ink)}
.cin .btn{min-height:50px;padding:0;font-size:20px}
.alt{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0}
.alt svg{width:64px;height:48px;border-radius:12px;background:var(--soft)}
.alt.cur .nm{color:var(--acc)}
</style>
</head>
<body>
<div class="app">
<div class="bar" id="bar"></div>
<main class="scr" id="scr"></main>
<nav class="tabs" id="tabs"><i class="tabind" id="tabind" aria-hidden="true"></i>
<a href="#plan" data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>План</a>
<a href="#program" data-v="program"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Программа</a>
<a href="#tracker" data-v="tracker"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>Трекер</a>
<a href="#coach" data-v="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h.01M15 10h.01"/></svg>Гирик</a>
<a href="#profile" data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Профиль</a>
</nav>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></svg>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sbody"></div></div>

<script>
{
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],DF=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
let S={profile:null,log:{},asked:{},swaps:{}};
try{const r=localStorage.getItem('podhod');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.swaps=S.swaps||{};S.myw=S.myw||{};
const save=()=>{try{localStorage.setItem('podhod',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const scr=$('scr'),bar=$('bar');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= анимированные силуэты ================= */
const FILL='var(--eqc)';
const EQ={
plate:(x,y,o)=>`<circle cx="${x}" cy="${y}" r="${o.r||9}" fill="${FILL}"/><circle cx="${x}" cy="${y}" r="2" fill="var(--card)"/>`,
db:(x,y)=>`<rect x="${x-7}" y="${y-3}" width="14" height="6" rx="2" fill="${FILL}"/><rect x="${x-9}" y="${y-5}" width="4" height="10" rx="1.5" fill="${FILL}"/><rect x="${x+5}" y="${y-5}" width="4" height="10" rx="1.5" fill="${FILL}"/>`,
dot:(x,y,o)=>`<circle cx="${x}" cy="${y}" r="${o.r||4}" fill="${FILL}"/>`,
hb:(x,y,o)=>`<line x1="${x-o.l}" y1="${y}" x2="${x+o.l}" y2="${y}" stroke="${FILL}" stroke-width="3" stroke-linecap="round"/>`,
vb:(x,y,o)=>`<line x1="${x}" y1="${y-o.l}" x2="${x}" y2="${y+o.l}" stroke="${FILL}" stroke-width="4" stroke-linecap="round"/>`,
cab:(x,y,o)=>`<line x1="${x}" y1="${y}" x2="${o.to[0]}" y2="${o.to[1]}" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="3 3"/>`
};
const bn=(x,y,w,h=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--mute)" opacity=".5"/>`;
const sl=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--mute)" stroke-width="6" stroke-linecap="round" opacity=".5"/>`;
const rod=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--mute)" stroke-width="3" stroke-linecap="round"/>`;
const ST={h:[60,14],s:[60,24],p:[60,48],k:[60,65],f:[60,82],e:[59,36],w:[60,48]};
const st=o=>Object.assign({},ST,o);
const POSE={
squat:{a:{h:[61,14],s:[60,24],p:[58,46],k:[60,64],f:[60,82],e:[48,26],w:[54,22]},b:{h:[60,32],s:[56,42],p:[42,60],k:[62,62],e:[44,44],w:[50,40]},eq:[['plate','w',{r:8,ox:-3,back:1}]]},

  <div class="qnav"${qi?'':' style="grid-template-columns:1fr"'}>${qi?'<button class="iconb" id="qb" aria-label="Назад">←</button>':''}<button class="btn" id="qn" ${(q.o&&v==null)||(q.pick&&draft.wdays.length!==draft.days)?'disabled':''}>${last?'Готово, составить план':'Дальше'}</button></div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=scr.querySelector('.prog i');if(i)i.style.width=newW+'%'}));
  if(q.o)scr.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(qBusy)return;draft[q.k]=q.k==='days'?+b.dataset.val:b.dataset.val;scr.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));$('qn').disabled=false;setTimeout(next,260)});
  if(q.num){const nv=$('nv'),rg=$('rg'),[mn,mx,stp]=q.num,set=x=>{x=Math.min(mx,Math.max(mn,Math.round(x/stp)*stp));draft[q.k]=x;nv.value=x;rg.value=x};set(+nv.value);
    nv.oninput=()=>{if(nv.value)draft[q.k]=+nv.value;rg.value=nv.value};nv.onchange=()=>set(+nv.value||q.num[3]);rg.oninput=()=>set(+rg.value);$('mi').onclick=()=>set(+nv.value-stp);$('pl').onclick=()=>set(+nv.value+stp)}
  if(q.time){draft.time=draft.time||'18:00';$('tm').onchange=e=>draft.time=e.target.value||'18:00';scr.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{draft.time=b.dataset.t;$('tm').value=b.dataset.t})}
  if(q.pick)bindPick(scr,draft.wdays,draft.days,renderQuiz);
  if(q.lifts){scr.querySelectorAll('[data-none]').forEach(b=>b.onclick=()=>{const L=draft.lifts[b.dataset.none];L.none=!L.none;renderQuiz()});
    scr.querySelectorAll('.lin').forEach(i=>i.oninput=()=>{draft.lifts[i.dataset.k][i.dataset.f]=i.value})}
  $('qn').onclick=next;if($('qb'))$('qb').onclick=()=>leave(-1,()=>{qi--;qDir=-1;renderQuiz()});
}
function next(){const q=Q[qi];if(q.num){const [mn,mx]=q.num;const v=+draft[q.k];if(!(v>=mn&&v<=mx))return}
  if(q.o&&draft[q.k]==null)return;if(q.pick&&draft.wdays.length!==draft.days)return;
  if(qi<Q.length-1){leave(1,()=>{qi++;qDir=1;renderQuiz()});return}
  if(qBusy)return;
  delete draft.wdaysFor;S.profile=Object.assign({},draft,{start:(S.profile&&S.profile.start)||key(today())});save();
  bar.innerHTML=`<span class="logo"></span><span class="t">Подход</span>`;
  leave(1,()=>{scr.innerHTML=`<div class="qbody inR" style="padding-top:60px">${say('Анализирую вес, цель и график…')}</div>`});
  setTimeout(()=>{location.hash='plan';route()},1100)}

/* ================= план ================= */
function renderPlan(){const p=S.profile,bmi=p.weight/((p.height/100)**2);
  const bl=bmi<18.5?'ниже нормы':bmi<25?'норма':bmi<30?'избыточный':'ожирение';
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const act={2:1.375,3:1.45,4:1.55,5:1.6,6:1.7}[p.days],adj={strength:150,mass:300,shape:-150,fat:-400,aesth:bmi<22?200:-300}[p.goal];
  const kcal=Math.round((bmr*act+adj)/10)*10,prot=Math.round(p.weight*(p.goal==='fat'?2:1.8)),water=(p.weight*0.033).toFixed(1);
  const advice={aesth:`Программа по разбору тренировок эстетичных атлетов: приоритет средним дельтам, верху груди и широчайшим, каждая мышца 2 раза в неделю. ${bmi<22?'Ты худощавый — небольшой профицит калорий (чистый набор).':'Сначала немного подсушись: тонкая талия делает V-силуэт заметнее любых плеч.'}`,strength:'Малые повторы, большие веса, длинный отдых. Прибавляй 2,5 кг в базовых, когда все подходы сделаны чисто.',
    mass:'Средние повторы, контроль темпа и небольшой профицит калорий. Каждую неделю добавляй вес или повтор.',
    shape:'Умеренные веса, 10–15 повторов, короткий отдых. Калории чуть ниже нормы, белка много.',
    fat:'Многоповторка с коротким отдыхом и кардио после силовой. Дефицит калорий — главный двигатель.'}[p.goal];
  let warn='';if(p.goal==='mass'&&bmi>=28)warn='С текущим ИМТ разумнее начать с цели «Форма» — сбросить жир, сохранив мышцы.';
  if(p.goal==='fat'&&bmi<20)warn='Вес уже невысокий — возможно, тебе больше подойдёт «Форма» или «Масса».';
  const sp=SP(),tw=wd(today());
  scr.innerHTML=`<h1>${GOALN[p.goal]} · ${p.days} ${p.days<5?'дня':'дней'} в неделю</h1><p class="lead">${advice}</p>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Когда ходить</h2><button class="chip" id="edd">Изменить дни</button></div><div class="week">${DN.map((n,i)=>{const j=sp.d.indexOf(i);return `<div class="day ${j>=0?'tr':''} ${i===tw?'today':''}"><b>${n}</b><span>${j>=0?T[sp.t[j]][0]:'Отдых'}</span>${j>=0?`<span class="tm">${p.time}</span>`:''}</div>`}).join('')}</div>
  <p class="note">Схема: ${sp.n}. Между тренировками одних мышц — минимум день отдыха.</p>
  <h2 style="margin-top:20px">Твои цифры</h2>
  <div class="stats"><div class="stat"><b>${bmi.toFixed(1)}</b><span>ИМТ — ${bl}</span></div><div class="stat"><b>${kcal}</b><span>ккал в день</span></div><div class="stat"><b>${prot} г</b><span>белка в день</span></div><div class="stat"><b>${water} л</b><span>воды в день</span></div></div>
  ${warn?`<div class="card" style="border-color:var(--acc);margin-bottom:12px">${warn}</div>`:''}
  <p class="note">Ориентир по формуле Миффлина — Сан Жеора, не медицинская рекомендация.</p>
  ${(()=>{const rows=LIFTS.map(([k,n])=>{const m=orm(k);if(!m)return '';const r=m/p.weight,f=p.sex==='f'?.65:1,lv={bench:[.75,1.25],squat:[1,1.5],deadlift:[1.25,2]}[k].map(x=>x*f),t=r<lv[0]?'начальный':r<lv[1]?'средний':'продвинутый';
    return `<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)"><span>${n}</span><span style="text-align:right"><b>~${Math.round(m)} кг</b> на 1 раз<br><span class="note">${r.toFixed(2).replace('.',',')}× веса · ${t}</span></span></div>`}).join('');
    return rows?`<div class="card" style="margin-top:14px"><h3>Твоя сила</h3><p class="note" style="margin:4px 0 6px">Оценка максимума на 1 раз по формуле Эпли — не проверяй его без страховки.</p>${rows}</div>`:''})()}
  ${p.goal==='aesth'?`<div class="card" style="margin-top:14px"><h3>Золотое сечение</h3><p class="note" style="margin:4px 0 10px">Обхват плеч ≈ талия × 1,618. Измерь талию на уровне пупка.</p>
  <div class="two"><label class="note">Талия, см<input id="waist" type="number" inputmode="decimal" value="${p.waist||''}" style="display:block;width:100%;min-height:48px;margin-top:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px;font-size:17px"></label>
  <div class="stat"><b id="gold">${p.waist?Math.round(p.waist*1.618):'—'}</b><span>цель для плеч, см</span></div></div></div>`:''}

  $('edd').onclick=openDays;
  if($('waist'))$('waist').oninput=e=>{const w=+e.target.value;p.waist=w||null;save();$('gold').textContent=w>40?Math.round(w*1.618):'—'}}
function openDays(){const p=S.profile,sel=daysOf().slice();let tm=p.time;
  const draw=()=>{openSheet(`<h2>Дни и время тренировок</h2><p class="note" style="margin:4px 0 0">Отметь ${p.days} ${p.days<5?'дня':'дней'}. Программа встанет на новые дни по порядку.</p>${pickHTML(sel,p.days)}
  <label class="note" style="display:block;margin-top:6px">Время<input id="dtm" type="time" value="${tm}" style="display:block;width:100%;min-height:48px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px;font-size:17px"></label>
  <div class="stack" style="margin-top:14px"><button class="btn" id="dsv" ${sel.length!==p.days?'disabled':''}>Сохранить</button><button class="btn ghost" id="dcl">Отмена</button></div>

/* ================= программа ================= */
const SWAPI='<svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>';
let progDay=null,curSlot=null;
function renderProgram(){const p=S.profile,sp=SP();
  if(progDay==null){const i=plannedIdx(today());progDay=i>=0?i:0}
  const t=sp.t[progDay];
  scr.innerHTML=`<button class="card pgpick" id="pgp"><span class="note">Программа</span><b>${PROGS[p.prog]?PROGS[p.prog].n:'Подобрана по опросу'}</b><span class="note">${sp.t.length} ${sp.t.length<5?'дня':'дней'} в неделю · сменить ›</span></button><div class="dsel">${sp.t.map((x,i)=>`<button class="${i===progDay?'on':''}" data-d="${i}">${DN[sp.d[i]]} · ${T[x][0].split(':')[0]}</button>`).join('')}</div>
  <div class="card"><h2>${T[t][0]}</h2><p class="note" style="margin:4px 0 6px">${DN[sp.d[progDay]]}, ${p.time}. Нажми на упражнение — откроется техника, ⇄ — замена.</p>
  ${T[t][1].map((_,j)=>{const id=exAt(progDay,j),e=EX[id],s=scheme(id,t);return `<div class="exr"><button class="exb" data-slot="${j}">${pic(id)}<span><span class="nm">${e.n}</span><span class="sr"><b>${s.sets} × ${s.reps}</b> · отдых ${s.rest}${workW(id,t)?`<br><b style="color:var(--ink)">${wTxt(workW(id,t))}</b>${workW(id,t).mine?' <span class="pill">твой</span>':''}`:''}</span></span></button><button class="swap" data-sw="${j}" aria-label="Сменить упражнение">${SWAPI}</button></div>`}).join('')}
  ${p.goal==='fat'?'<div class="cardio">+ Кардио 20–25 мин: дорожка в горку или велотренажёр, пульс 120–140.</div>':''}</div>

  scr.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{progDay=+b.dataset.d;renderProgram()});$('pgp').onclick=openProgs;
  scr.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{curSlot=[progDay,+b.dataset.slot];location.hash='ex-'+exAt(progDay,+b.dataset.slot)});
  scr.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>openSwap(progDay,+b.dataset.sw));
}
function openProgs(){const p=S.profile,cur=p.prog||'';
  openSheet(`<h2>Выбери программу</h2><p class="note" style="margin:4px 0 10px">Программы «в стиле» собраны по интервью и разборам атлетов — это не их официальные планы. Рабочие веса и замены упражнений работают везде.</p>
  <div class="stack">${[['', 'Подобрана по опросу', `${p.daysAuto||p.days} дн. · под цель «${GOALN[p.goal]}»`, 'Программа из твоих ответов в опросе.'],...Object.entries(PROGS).map(([k,v])=>[k,v.n,`${v.d} ${v.d<5?'дня':'дней'} в неделю`,v.s])].map(([k,n,d,txt])=>`<button class="card prg ${k===cur?'on':''}" data-prog="${k}"><b>${n}${k===cur?' ✓':''}</b><span class="note">${d}</span><span style="font-size:14px">${txt}</span></button>`).join('')}</div>
  <button class="btn ghost" id="pcl" style="margin-top:12px">Отмена</button>`);
  $('pcl').onclick=closeSheet;
  sbody.querySelectorAll('[data-prog]').forEach(b=>b.onclick=()=>{const k=b.dataset.prog;if(k){if(!p.prog)p.daysAuto=p.days;p.prog=k;p.days=PROGS[k].d}else{if(p.daysAuto)p.days=p.daysAuto;delete p.prog;delete p.daysAuto}
    if(!p.wdays||p.wdays.length!==p.days)delete p.wdays;save();closeSheet();progDay=null;renderProgram()})}
function openSwap(i,j){const cur=exAt(i,j),t=SP().t[i],orig=T[t][1][j];
  openSheet(`<h2>Сменить упражнение</h2><p class="note" style="margin:4px 0 8px">Варианты на ту же группу мышц.</p>
  ${ALTS(cur).map(id=>{const e=EX[id];return `<button class="alt ${id===cur?'cur':''}" data-pick="${id}">${pic(id)}<span><span class="nm">${e.n}${id===cur?' · сейчас':''}${id===orig&&id!==cur?' · исходное':''}</span><span class="sr">${e.m.join(', ')}</span></span></button>`}).join('')}
  <button class="btn ghost" id="scl" style="margin-top:10px">Отмена</button>`);
  $('scl').onclick=closeSheet;
  sbody.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick;if(id===orig)delete S.swaps[slotKey(i,j)];else S.swaps[slotKey(i,j)]=id;save();closeSheet();
    if(location.hash.startsWith('#ex-')){curSlot=[i,j];location.hash='ex-'+id}else renderProgram()});
}

/* ================= упражнение ================= */
function renderEx(id){const e=EX[id];if(!e){location.hash='program';return}const exTpl=curSlot&&exAt(curSlot[0],curSlot[1])===id?SP().t[curSlot[0]]:undefined,s=scheme(id,exTpl);
  bar.innerHTML=`<button class="iconb" id="back" aria-label="Назад">←</button><span class="t" style="font-size:16px">Техника</span>`;
  $('back').onclick=()=>{location.hash='program'};
  const slotOk=curSlot&&exAt(curSlot[0],curSlot[1])===id;
  scr.innerHTML=`<div class="stage"><svg id="anim" viewBox="0 -4 120 94" role="img" aria-label="Анимация: ${e.n}"></svg><button class="play" id="play" aria-label="Пауза">❚❚</button></div>
  <h1 style="margin-top:16px">${e.n}</h1>

  <p class="note" style="margin:-4px 0 0">Красным — что качает, бледно-красным и серым — что помогает.</p>
  <div class="big"><div><b>${s.sets}</b><span>подхода</span></div><div><b>${s.reps}</b><span>${e.hold?'удержание':'повторений'}</span></div><div><b>${s.rest}</b><span>отдых</span></div></div>
  <div id="wcard"></div>
  ${slotOk?`<button class="btn ghost sbtn" id="swx">${SWAPI} Сменить упражнение</button>`:''}
  <div class="stack" style="margin-top:12px"><div class="card"><h3>Правильная техника</h3><ol class="steps">${e.st.map(x=>`<li>${x}</li>`).join('')}</ol></div>
  <div class="card"><h3>Частые ошибки</h3><ul class="bad">${e.er.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="card" style="background:var(--accs);border-color:transparent"><h3>Для лучшей нагрузки</h3><p style="margin:6px 0 0">${e.tip}</p></div></div>`;
  const a=animate($('anim'),id),pb=$('play');
  if(reduce){pb.textContent='▶';pb.setAttribute('aria-label','Запустить')}
  pb.onclick=()=>{const p=a.toggle();pb.textContent=p?'▶':'❚❚';pb.setAttribute('aria-label',p?'Запустить':'Пауза')};
  if(slotOk)$('swx').onclick=()=>openSwap(curSlot[0],curSlot[1]);
  drawW(id,false);
}
function drawW(id,edit){const box=$('wcard');if(!box)return;const x=workW(id,curSlot&&exAt(curSlot[0],curSlot[1])===id?SP().t[curSlot[0]]:undefined);if(!x){box.innerHTML='';return}

    <p class="note" style="margin:4px 0 8px">${bwx?'0 — если делаешь со своим весом.':'Вес, с которым делаешь рабочие подходы'+({db:' (одна гантель)',side:' (на одном блоке)',sled:' (без веса салазок)'}[WB[id][2]]||'')+'.'}</p>
    <div class="num" style="margin:8px 0"><button id="wm" aria-label="Меньше">−</button><input id="wv" type="number" inputmode="decimal" step="${st}" min="0" value="${cur??(parseFloat(String(x.txt).replace(',','.').match(/[\d.]+/))||0)}" aria-label="Вес, кг" style="font-size:44px;width:140px"><button id="wp" aria-label="Больше">+</button></div><p class="unit">кг</p>
    <div class="two" style="margin-top:12px"><button class="btn" id="wsv">Сохранить</button><button class="btn ghost" id="wcl">Отмена</button></div></div>`;
    const wv=$('wv'),fix=v=>Math.max(0,Math.round(v*10)/10);$('wm').onclick=()=>wv.value=fix(+wv.value-st);$('wp').onclick=()=>wv.value=fix(+wv.value+st);
    $('wsv').onclick=()=>{const v=+wv.value;if(!(v>=0&&v<=500))return;S.myw[id]=fix(v);save();drawW(id,false)};$('wcl').onclick=()=>drawW(id,false);wv.focus();return}
  box.innerHTML=x.mine?`<div class="card" style="margin-bottom:12px;border-color:var(--acc)"><h3>Твой рабочий вес: ${x.txt}</h3>
    <p class="note" style="margin:6px 0 10px">Сделал все подходы на верхнюю границу повторов с запасом — прибавь.</p>
    <div class="stack"><button class="btn" id="wup">Прибавить +${String(st).replace('.',',')} кг → ${fmtW(id,Math.round((cur+st)*10)/10)}</button>
    <div class="two"><button class="btn ghost" id="wed">Изменить</button><button class="btn ghost" id="wrs">Вернуть расчёт</button></div></div></div>`
  :`<div class="card" style="margin-bottom:12px;border-color:var(--acc)"><h3>Рабочий вес: ${x.txt}</h3><p class="note" style="margin:6px 0 10px">${x.src?'Посчитано из твоих весов в опросе.':isBw?'Подобрано по твоей силе и опыту.':'Оценка по весу тела, полу и опыту — тренажёры у всех разные, подстрой на первой тренировке: последние 1–2 повтора тяжело, но технично.'}${x.start?' Новичку: первые 1–2 недели можно начать с пустого грифа (20 кг).':''}</p>
    <button class="btn ghost" id="wed">Указать свой вес</button></div>`;
  $('wed').onclick=()=>drawW(id,true);
  if(x.mine){$('wup').onclick=()=>{S.myw[id]=Math.round((cur+st)*10)/10;save();drawW(id,false)};$('wrs').onclick=()=>{delete S.myw[id];save();drawW(id,false)}}}

/* ================= трекер ================= */
const HAB=[['gym','Зал'],['water','Вода'],['sleep','Сон'],['prot','Белок'],['steps','Шаги']];
let wkOff=0;
function weekDays(){const t=today(),m=new Date(t);m.setDate(t.getDate()-wd(t)+wkOff*7);return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}
function stats(){const t=today();let streak=0;const d=new Date(t);
  if(!(S.log[key(d)]||{}).gym)d.setDate(d.getDate()-1);
  for(let i=0;i<120;i++){const L=S.log[key(d)]||{};if(L.gym==='done')streak++;else if(plannedIdx(d)>=0)break;d.setDate(d.getDate()-1)}

[/(отдых|между подход|сколько отдых)/,()=>'Между подходами: в базовых 2–3 минуты, в изоляции 60–90 секунд. Точное время написано у каждого упражнения в программе.'],
[/(прибав|прогресс|застой|плато|не растёт|не растет)/,()=>'Прибавляй, когда во всех подходах сделал верхнюю границу повторов с запасом: штанга +2,5 кг, гантели +1–2 кг. Если 3 недели нет прогресса — проверь сон и калории, а затем сделай лёгкую неделю.'],
[/(до трен|перед трен|после трен|питани|что есть|что поесть)/,()=>'За 1–2 часа до тренировки — углеводы и немного белка (рис/овсянка + курица/творог). После — белок 25–40 г и углеводы в течение пары часов.'],
[/(пропуст|пропуск)/,()=>'Один пропуск ничего не ломает. Просто сделай следующую тренировку по плану, не пытайся «догнать» двумя сразу. В трекере нажми «Нет» — и я подберу тренировку дома или на отдыхе.'],
[/(программ|лейд|laid|zyzz|зизз|зейн|zane|бамстед|cbum|kinobody|кинободи)/,()=>'Есть программы в стиле: '+Object.values(PROGS).map(v=>v.n.replace('В стиле ','').replace('Классика ',''))+'. Открой «Программа» → «сменить» вверху, там описание каждой.'],
[/(спасибо|спс|благодар)/,()=>'Всегда пожалуйста! Иди качайся 💪'.replace(' 💪','.')]];
const nrm=t=>t.toLowerCase().replace(/ё/g,'е');
function findEx(q){const qs=nrm(q).split(/[^а-яa-z]+/).filter(w=>w.length>=3);let best=null,bs=0;
  for(const [id,e] of Object.entries(EX)){const ns=nrm(e.n).split(/[^а-яa-z]+/).filter(w=>w.length>=3);let sc=0;for(const n of ns){const a=n.slice(0,Math.min(n.length,5));if(qs.some(w=>w.startsWith(a.slice(0,Math.max(3,Math.min(a.length,w.length))))&&a.startsWith(w.slice(0,3))))sc++}if(sc>bs){bs=sc;best=id}}return bs?best:null}
function answer2(q){q=q.toLowerCase().trim();
  const exId=/(вес|кг|сколько|техник|как делать|правильно)/.test(q)&&findEx(q);
  if(exId){const e=EX[exId],w=workW(exId),s=scheme(exId);return `${e.n}: ${s.sets}×${s.reps}${w?', рабочий вес '+w.txt:''}. Качает: ${e.m.join(', ')}. Главное в технике: ${e.st[2]}`}
  for(const [re,fn] of RULES2)if(re.test(q))return fn();
  const ex=findEx(q);if(ex){const e=EX[ex];return `${e.n}. Совет: ${e.tip}`}
  return 'Пока я понимаю простые вопросы — про тренировку на сегодня или завтра, калории, белок, воду, сон, боль в мышцах, прогресс, кардио, программы и веса в упражнениях. Попробуй спросить по-другому.'}
function chatPush(from,t){S.chat=S.chat||[];S.chat.push({f:from,t});S.chat=S.chat.slice(-60);save()}
function renderCoach(){S.chat=S.chat||[];const tk=key(today());
  if(S.chatDay!==tk){S.chatDay=tk;chatPush('g',`Привет${S.chat.length?' снова':''}! Как ты сегодня?`)}
  const last=S.chat[S.chat.length-1];
  scr.innerHTML=`<div class="chat" id="chat">${S.chat.map(m=>m.f==='g'?`<div class="msg g">${MASCOT}<div class="bub">${esc(m.t).replace(/\n/g,'<br>')}</div></div>`:`<div class="msg u"><div class="bub">${esc(m.t)}</div></div>`).join('')}</div>
  <div class="chips2">${(last&&/как ты/i.test(last.t)?['Отлично 💪','Нормально','Устал','Что-то болит']:SUG).map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x.replace(' 💪',''))}</button>`).join('')}</div>
  <form class="cin" id="cin"><input id="cq" placeholder="Спроси Гирика…" autocomplete="off" enterkeyhint="send" aria-label="Вопрос"><button class="btn" aria-label="Отправить">↑</button></form>`;
  scr.scrollTop=scr.scrollHeight;
  const ask=q=>{q=q.replace(' 💪','').trim();if(!q)return;chatPush('u',q);chatPush('g',answer2(q));renderCoach()};
  scr.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
  $('cin').onsubmit=e=>{e.preventDefault();ask($('cq').value)}}

/* ================= роутинг ================= */
function rerender(){if(location.hash==='#tracker')renderTracker()}
let curV=null,navTok=0,swipeNav=false;const ORDER={plan:0,program:1,tracker:2,coach:3,profile:4},DEEP=new Set(['ex','atlets']);
function route(){stopAnim();closeSheet();let h=location.hash.slice(1)||'plan';if(!S.profile&&h!=='quiz')h='quiz';
  let v=h.startsWith('ex-')?'ex':h;if(!['quiz','plan','program','tracker','coach','profile','ex','atlets'].includes(v))v='plan';
  const prev=curV;curV=v;
  const dir=prev==null||v==='quiz'||prev==='quiz'?0:DEEP.has(v)&&!DEEP.has(prev)?1:DEEP.has(prev)&&!DEEP.has(v)?-1:DEEP.has(v)?1:Math.sign(ORDER[v]-ORDER[prev]);
  if(v in ORDER)$('tabind').style.transform=`translateX(${ORDER[v]*100}%)`;
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const tok=++navTok;
  const paint=()=>{if(tok!==navTok)return;
    const tabs=v!=='quiz'&&v!=='ex'&&v!=='atlets';scr.classList.toggle('qm',v==='quiz');$('tabs').style.display=tabs?'':'none';scr.classList.toggle('noTab',!tabs);
    const TT={plan:'План',program:'Программа',tracker:'Трекер',coach:'Гирик',profile:'Профиль'};
    if(tabs)bar.innerHTML=`<span class="logo"></span><span class="t">${TT[v]}</span>`;
    if(v==='quiz'){qPrevW=0;renderQuiz()}if(v==='plan')renderPlan();if(v==='program')renderProgram();if(v==='tracker')renderTracker();if(v==='profile')renderProfile();if(v==='ex')renderEx(h.slice(3));if(v==='atlets')renderAtlets();if(v==='coach')renderCoach();
    scr.scrollTop=0;scr.classList.remove('pgOutL','pgOutR','pgInL','pgInR');bar.classList.remove('bIn');
    if(!reduce&&prev!=null){void scr.offsetWidth;if(dir)scr.classList.add(dir>0?'pgInR':'pgInL');if(dir||v==='quiz')bar.classList.add('bIn')}};
  const sn=swipeNav;swipeNav=false;
  if(!dir||reduce||sn||prev===v&&v!=='ex'){paint();return}
  scr.classList.remove('pgInL','pgInR');scr.classList.add(dir>0?'pgOutL':'pgOutR');setTimeout(paint,150)}
window.addEventListener('hashchange',route);
/* свайп пальцем между страницами */
const TABV=['plan','program','tracker','coach','profile'];
function swTarget(dx){const v=curV;if(v in ORDER){const i=ORDER[v]+(dx<0?1:-1);return TABV[i]||null}
  if(DEEP.has(v)&&dx>0)return v==='atlets'?'plan':'program';return null}
let sw=null;
scr.addEventListener('touchstart',e=>{sw=null;if(e.touches.length!==1||sheet.classList.contains('on')||curV==='quiz'||e.target.closest('.dsel,input,.num,.stage'))return;
  const t=e.touches[0];sw={x:t.clientX,y:t.clientY,t0:Date.now(),dx:0,lock:null}},{passive:true});
scr.addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(sw.lock===null&&(Math.abs(dx)>10||Math.abs(dy)>10))sw.lock=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';
  if(sw.lock!=='x')return;e.preventDefault();const W=scr.clientWidth,tg=swTarget(dx),d=tg?dx:dx*.22;sw.dx=dx;
  scr.style.transition='none';scr.style.transform=`translateX(${d}px)`;scr.style.opacity=1-Math.min(.45,Math.abs(d)/W*.55);
  if(curV in ORDER&&tg){$('tabind').style.transition='none';$('tabind').style.transform=`translateX(${(ORDER[curV]-dx/W)*100}%)`}},{passive:false});
function swEnd(){if(!sw||sw.lock!=='x'){sw=null;return}const W=scr.clientWidth,dx=sw.dx,tg=swTarget(dx),vel=Math.abs(dx)/Math.max(1,Date.now()-sw.t0);sw=null;
  const ti=$('tabind');ti.style.transition='';
  if(tg&&(Math.abs(dx)>W*.28||vel>.45)){scr.style.transition='transform .18s ease-in,opacity .18s ease-in';scr.style.transform=`translateX(${Math.sign(dx)*W*.45}px)`;scr.style.opacity='0';
    setTimeout(()=>{scr.style.transition='';scr.style.transform='';scr.style.opacity='';swipeNav=true;location.hash=tg},170)}
  else{scr.style.transition='transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .3s';scr.style.transform='';scr.style.opacity='';if(curV in ORDER)ti.style.transform=`translateX(${ORDER[curV]*100}%)`;setTimeout(()=>{scr.style.transition=''},320)}}
scr.addEventListener('touchend',swEnd);scr.addEventListener('touchcancel',swEnd);
/* без зума, жестов и прокрутки всей страницы */
for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
let tY=0,tX=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){tY=e.touches[0].clientY;tX=e.touches[0].clientX}},{passive:true});
document.addEventListener('touchmove',e=>{if(e.touches.length>1){e.preventDefault();return}
  const box=e.target.closest('.scr,.sheet,.dsel');if(!box){e.preventDefault();return}
  const dy=e.touches[0].clientY-tY,dx=e.touches[0].clientX-tX;
  if(box.classList.contains('dsel')){if(Math.abs(dy)>Math.abs(dx))e.preventDefault();else if((dx>0&&box.scrollLeft<=0)||(dx<0&&box.scrollLeft+box.clientWidth>=box.scrollWidth-1))e.preventDefault();return}
  if(Math.abs(dx)>Math.abs(dy)){e.preventDefault();return}
  if(box.scrollHeight<=box.clientHeight+1||(dy>0&&box.scrollTop<=0)||(dy<0&&box.scrollTop+box.clientHeight>=box.scrollHeight-1))e.preventDefault()},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<300&&!e.target.closest('input,button,a'))e.preventDefault();lastTap=n},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault()});
route();if(S.profile)setTimeout(checkMissed,900);
}
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
